[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "bugsage"
version = "0.1.0"
description = "AI-powered Python error analysis CLI"
readme = "README.md"
requires-python = ">=3.10"

dependencies = [
    "typer",
    "requests",
    "openai",
    "rich",
    "google-genai"
]

[project.scripts]
bugsage = "bugsage.cli.main:app"